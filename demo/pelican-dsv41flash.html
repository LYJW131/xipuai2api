<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Riding a Bicycle</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(160deg, #bfe7f5 0%, #e8f6fb 55%, #fdf3e3 100%);
    font-family: system-ui, sans-serif;
  }
  svg {
    width: min(92vw, 780px);
    height: auto;
    display: block;
  }
  /* wheel spin */
  .wheel-spokes {
    transform-origin: center;
    animation: spin 1.1s linear infinite;
  }
  .wheel-spokes.slow {
    animation-duration: 1.45s;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* gentle bobbing of the whole rider+bike group */
  .rig {
    transform-origin: center bottom;
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.5px); }
  }
  /* clouds drift */
  .cloud {
    animation: drift 14s ease-in-out infinite alternate;
  }
  .cloud.b { animation-duration: 19s; animation-direction: alternate-reverse; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(26px); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 780 460" role="img" aria-label="A charming pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7fc"/>
      <stop offset="1" stop-color="#fdf3e3"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9c9"/>
      <stop offset="1" stop-color="#b7ddb0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#f59e1c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="780" height="460" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="660" cy="90" r="42" fill="#ffe9a8"/>
  <circle cx="660" cy="90" r="30" fill="#ffe17a"/>

  <!-- clouds -->
  <g class="cloud" fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="52" ry="26"/>
    <ellipse cx="200" cy="80" rx="40" ry="30"/>
    <ellipse cx="105" cy="100" rx="38" ry="20"/>
  </g>
  <g class="cloud b" fill="#ffffff" opacity="0.8">
    <ellipse cx="470" cy="60" rx="46" ry="22"/>
    <ellipse cx="515" cy="52" rx="34" ry="26"/>
    <ellipse cx="432" cy="70" rx="32" ry="17"/>
  </g>

  <!-- ground -->
  <rect x="0" y="368" width="780" height="92" fill="url(#ground)"/>
  <path d="M0 368 H780" stroke="#9ccf93" stroke-width="3"/>

  <!-- ================= BICYCLE + PELICAN ================= -->
  <g class="rig">

    <!-- bicycle -->
    <g>
      <!-- rear wheel -->
      <g>
        <circle cx="250" cy="330" r="52" fill="none" stroke="#3a4a5a" stroke-width="8"/>
        <circle cx="250" cy="330" r="46" fill="none" stroke="#c9d6e2" stroke-width="3"/>
        <g class="wheel-spokes">
          <g stroke="#8fa3b6" stroke-width="2.5" stroke-linecap="round">
            <line x1="250" y1="288" x2="250" y2="372"/>
            <line x1="250" y1="288" x2="250" y2="372" transform="rotate(45 250 330)"/>
            <line x1="250" y1="288" x2="250" y2="372" transform="rotate(90 250 330)"/>
            <line x1="250" y1="288" x2="250" y2="372" transform="rotate(135 250 330)"/>
          </g>
        </g>
        <circle cx="250" cy="330" r="7" fill="#3a4a5a"/>
      </g>

      <!-- front wheel -->
      <g>
        <circle cx="520" cy="330" r="52" fill="none" stroke="#3a4a5a" stroke-width="8"/>
        <circle cx="520" cy="330" r="46" fill="none" stroke="#c9d6e2" stroke-width="3"/>
        <g class="wheel-spokes slow">
          <g stroke="#8fa3b6" stroke-width="2.5" stroke-linecap="round">
            <line x1="520" y1="288" x2="520" y2="372"/>
            <line x1="520" y1="288" x2="520" y2="372" transform="rotate(45 520 330)"/>
            <line x1="520" y1="288" x2="520" y2="372" transform="rotate(90 520 330)"/>
            <line x1="520" y1="288" x2="520" y2="372" transform="rotate(135 520 330)"/>
          </g>
        </g>
        <circle cx="520" cy="330" r="7" fill="#3a4a5a"/>
      </g>

      <!-- frame -->
      <g stroke="#e0562f" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="250" y1="330" x2="385" y2="330"/>  <!-- chainstay -->
        <line x1="385" y1="330" x2="345" y2="240"/>  <!-- seat tube -->
        <line x1="345" y1="240" x2="250" y2="330"/>  <!-- seat stay -->
        <line x1="385" y1="330" x2="470" y2="255"/>  <!-- down tube -->
        <line x1="345" y1="240" x2="470" y2="255"/>  <!-- top tube -->
        <line x1="470" y1="255" x2="520" y2="330"/>  <!-- fork -->
      </g>

      <!-- handlebar -->
      <g stroke="#3a4a5a" stroke-width="8" stroke-linecap="round" fill="none">
        <line x1="470" y1="255" x2="470" y2="228"/>
        <path d="M452 228 Q470 214 492 226" />
      </g>

      <!-- seat -->
      <g>
        <path d="M320 236 Q345 224 372 236 Q345 246 320 236 Z" fill="#3a4a5a"/>
        <line x1="345" y1="236" x2="345" y2="222" stroke="#3a4a5a" stroke-width="6"/>
      </g>

      <!-- pedal crank -->
      <g>
        <circle cx="385" cy="330" r="14" fill="#3a4a5a"/>
        <circle cx="385" cy="330" r="6" fill="#c9d6e2"/>
        <line x1="385" y1="330" x2="368" y2="352" stroke="#3a4a5a" stroke-width="7" stroke-linecap="round"/>
        <line x1="385" y1="330" x2="402" y2="308" stroke="#3a4a5a" stroke-width="7" stroke-linecap="round"/>
        <rect x="358" y="348" width="20" height="8" rx="3" fill="#2b3846"/>
        <rect x="392" y="302" width="20" height="8" rx="3" fill="#2b3846"/>
      </g>
    </g>

    <!-- pelican -->
    <g>
      <!-- tail -->
      <path d="M300 200 Q272 188 258 200 Q274 206 288 214 Z" fill="#e8e2d6" stroke="#cfc6b4" stroke-width="2"/>

      <!-- body -->
      <ellipse cx="352" cy="205" rx="66" ry="52" fill="url(#bodyGrad)" stroke="#cfc6b4" stroke-width="2.5"/>

      <!-- wing / arm reaching handlebar -->
      <path d="M362 200 Q420 190 466 226"
            stroke="#cfc6b4" stroke-width="28" stroke-linecap="round" fill="none"/>
      <path d="M362 200 Q420 190 466 226"
            stroke="#f4efe4" stroke-width="22" stroke-linecap="round" fill="none"/>

      <!-- leg to pedal -->
      <path d="M368 242 Q372 300 396 322"
            stroke="#f59e1c" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M368 242 Q372 300 396 322"
            stroke="#ffc94d" stroke-width="8" stroke-linecap="round" fill="none"/>
      <!-- foot -->
      <path d="M396 322 q16 6 26 2" stroke="#f59e1c" stroke-width="10" stroke-linecap="round" fill="none"/>

      <!-- back leg on other pedal -->
      <path d="M340 246 Q330 300 362 344"
            stroke="#e58f12" stroke-width="13" stroke-linecap="round" fill="none"/>

      <!-- neck -->
      <path d="M368 182 Q388 132 372 100"
            stroke="#cfc6b4" stroke-width="40" stroke-linecap="round" fill="none"/>
      <path d="M368 182 Q388 132 372 100"
            stroke="#f7f3ea" stroke-width="34" stroke-linecap="round" fill="none"/>

      <!-- head -->
      <circle cx="374" cy="94" r="30" fill="#fbf9f3" stroke="#cfc6b4" stroke-width="2.5"/>

      <!-- beak -->
      <path d="M398 84 Q470 82 462 100 Q452 108 420 108 L398 100 Z"
            fill="url(#beakGrad)" stroke="#e08b12" stroke-width="2"/>
      <!-- pouch -->
      <path d="M398 100 Q430 108 458 100 Q440 128 414 118 Q404 111 398 100 Z"
            fill="#f9b93c" stroke="#e08b12" stroke-width="2"/>

      <!-- eye -->
      <circle cx="384" cy="86" r="6" fill="#2b3846"/>
      <circle cx="386" cy="84" r="2.2" fill="#ffffff"/>

      <!-- tiny cheek blush -->
      <circle cx="370" cy="104" r="6" fill="#f7b2b2" opacity="0.6"/>

      <!-- little hat for charm -->
      <g>
        <path d="M344 74 Q374 56 404 74 Z" fill="#e0562f"/>
        <rect x="342" y="72" width="64" height="7" rx="3.5" fill="#c0431f"/>
        <circle cx="374" cy="58" r="6" fill="#ffe9a8"/>
      </g>

      <!-- wind lines -->
      <g stroke="#a9c9dd" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <line x1="240" y1="150" x2="288" y2="150"/>
        <line x1="228" y1="172" x2="270" y2="172"/>
        <line x1="248" y1="196" x2="292" y2="196"/>
      </g>
    </g>
  </g>
</svg>
</body>
</html>
