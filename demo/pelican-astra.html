<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的单车时光</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f6f2e8;color:#294c4a;font-family:system-ui,sans-serif}main{width:min(960px,100%);padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}small{letter-spacing:3px;color:#788b7e}h1{font-size:clamp(22px,4vw,36px);margin:8px 0 22px}button{border:1px solid #b7c6b7;border-radius:24px;background:transparent;color:inherit;padding:10px 18px;cursor:pointer}button:focus-visible{outline:3px solid #dc8956;outline-offset:4px}svg{display:block;width:100%;height:auto;border-radius:24px;background:#e2efe7}footer{text-align:center;font-size:13px;color:#788b7e;margin-top:18px}.spin{animation:spin 1.8s linear infinite;transform-origin:0 0}.bird{animation:bob 1.8s ease-in-out infinite}.cloud{animation:drift 9s ease-in-out infinite alternate}.paused *{animation-play-state:paused!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes drift{to{transform:translateX(22px)}}@media(prefers-reduced-motion:reduce){.spin,.bird,.cloud{animation:none}}
</style>
</head>
<body>

</svg>
<footer>迎着风，慢慢骑。今天也有好风景。</footer>
</main>
<script>
const button=document.getElementById('toggle'),scene=document.getElementById('scene'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
function sync(){const paused=scene.classList.contains('paused');button.disabled=reduced.matches;button.textContent=reduced.matches?'已减少动态效果':paused?'继续骑行':'暂停动画';button.setAttribute('aria-pressed',String(paused||reduced.matches));}
button.addEventListener('click',()=>{scene.classList.toggle('paused');sync()});reduced.addEventListener('change',sync);sync();
</script>
</body>
</html>
